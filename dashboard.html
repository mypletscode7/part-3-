<script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    updateDoc,
    setDoc,
    collection,
    addDoc,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {
    apiKey: "AIzaSyBNI4CR26Re0xdh-T0XdVyb6fFN7SPgPNA",
    authDomain: "the-myp-haven.firebaseapp.com",
    projectId: "the-myp-haven",
    storageBucket: "the-myp-haven.firebasestorage.app",
    messagingSenderId: "904577455533",
    appId: "1:904577455533:web:1d918ee8a3caa547eefd24"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;
let selectedSubjects = [];
let tasks = [];
let gamePlans = [];
let upcomingEvents = [];

let selectedGameType = "";
let selectedComingType = "";

let lockedIn = false;
let sliderProgress = 0;
let dragging = false;


/* =========================================
   DOM ELEMENTS
========================================= */

const lockSlider =
    document.getElementById("lock-slider");

const lockHandle =
    document.getElementById("lock-handle");

const lockProgress =
    document.getElementById("lock-progress");

const lockText =
    document.getElementById("lock-text");

const dashboardContent =
    document.getElementById("dashboard-content");


/* =========================================
   DATE
========================================= */

function updateDate() {

    const now = new Date();

    document.getElementById("current-date").textContent =
        now.toLocaleDateString("en-US", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        });
}

updateDate();


/* =========================================
   LOCAL DATE STRING
========================================= */

function getLocalDateString() {

    const now = new Date();

    return `${now.getFullYear()}-${String(
        now.getMonth() + 1
    ).padStart(2, "0")}-${String(
        now.getDate()
    ).padStart(2, "0")}`;
}


/* =========================================
   AUTHENTICATION
========================================= */

onAuthStateChanged(auth, async user => {

    if (!user) {

        window.location.href = "./account.html";

        return;
    }

    currentUser = user;

    console.log("Logged in:", currentUser.uid);

    await loadUserData();

    loadBackground();

    setupSubjectDropdowns();

    renderEverything();

    restoreLockedSlider();

});


/* =========================================
   LOAD USER DATA
========================================= */

async function loadUserData() {

    try {

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );

        const userSnap =
            await getDoc(userRef);


        if (userSnap.exists()) {

            const data = userSnap.data();


            if (Array.isArray(data.subjects)) {

                selectedSubjects =
                    data.subjects;

            }


            if (data.lockedIn === true) {

                lockedIn = true;

            }

        }


        /* FALLBACK TO SURVEY */

        if (selectedSubjects.length === 0) {

            const localSurvey =
                localStorage.getItem(
                    "mypHavenSurvey"
                );

            if (localSurvey) {

                try {

                    const survey =
                        JSON.parse(
                            localSurvey
                        );

                    if (
                        Array.isArray(
                            survey.subjects
                        )
                    ) {

                        selectedSubjects =
                            survey.subjects;

                    }

                } catch (error) {

                    console.error(
                        "Survey data error:",
                        error
                    );

                }

            }

        }


        await loadDashboardData();


    } catch (error) {

        console.error(
            "Could not load user data:",
            error
        );

    }

}


/* =========================================
   LOAD DASHBOARD DATA
========================================= */

async function loadDashboardData() {

    try {

        /* TASKS */

        const tasksRef =
            collection(
                db,
                "users",
                currentUser.uid,
                "tasks"
            );

        const taskSnapshot =
            await getDocs(tasksRef);

        tasks =
            taskSnapshot.docs.map(
                item => ({
                    id: item.id,
                    ...item.data()
                })
            );


        /* GAME PLANS */

        const gameRef =
            collection(
                db,
                "users",
                currentUser.uid,
                "gamePlans"
            );

        const gameSnapshot =
            await getDocs(gameRef);

        gamePlans =
            gameSnapshot.docs.map(
                item => ({
                    id: item.id,
                    ...item.data()
                })
            );


        /* UPCOMING */

        const upcomingRef =
            collection(
                db,
                "users",
                currentUser.uid,
                "upcoming"
            );

        const upcomingSnapshot =
            await getDocs(upcomingRef);

        upcomingEvents =
            upcomingSnapshot.docs.map(
                item => ({
                    id: item.id,
                    ...item.data()
                })
            );


        console.log(
            "Dashboard data loaded:",
            {
                tasks,
                gamePlans,
                upcomingEvents
            }
        );


    } catch (error) {

        console.error(
            "Could not load dashboard data:",
            error
        );

    }

}


/* =========================================
   SUBJECT DROPDOWNS
========================================= */

function setupSubjectDropdowns() {

    const dropdowns = [

        document.getElementById(
            "game-subject"
        ),

        document.getElementById(
            "coming-subject"
        )

    ];


    dropdowns.forEach(dropdown => {

        dropdown.innerHTML = "";


        selectedSubjects.forEach(subject => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = subject;
            option.textContent = subject;

            dropdown.appendChild(option);

        });


        const other =
            document.createElement(
                "option"
            );

        other.value = "Other";
        other.textContent = "Other";

        dropdown.appendChild(other);

    });

}


/* =========================================
   RENDER EVERYTHING
========================================= */

function renderEverything() {

    updateMetrics();

    renderGamePlans();

    renderComingUp();

}


/* =========================================
   DATE ONLY
========================================= */

function dateOnly(date) {

    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );

}


/* =========================================
   METRICS
========================================= */

function updateMetrics() {

    const today =
        dateOnly(new Date());

    const weekEnd =
        new Date(today);

    weekEnd.setDate(
        weekEnd.getDate() + 7
    );


    let dueToday = 0;
    let dueWeek = 0;
    let completed = 0;
    let overdue = 0;


    tasks.forEach(task => {

        if (!task.dueDate) {
            return;
        }


        const due =
            dateOnly(
                new Date(task.dueDate)
            );


        if (task.status === "Completed") {

            completed++;

            return;

        }


        if (
            due.getTime() ===
            today.getTime()
        ) {

            dueToday++;

        }


        if (
            due >= today &&
            due < weekEnd
        ) {

            dueWeek++;

        }


        if (due < today) {

            overdue++;

        }

    });


    gamePlans.forEach(plan => {

        if (!plan.date) {
            return;
        }


        const due =
            dateOnly(
                new Date(plan.date)
            );


        if (plan.status === "Completed") {

            completed++;

            return;

        }


        if (
            due.getTime() ===
            today.getTime()
        ) {

            dueToday++;

        }


        if (
            due >= today &&
            due < weekEnd
        ) {

            dueWeek++;

        }


        if (due < today) {

            overdue++;

        }

    });


    document.getElementById(
        "due-today"
    ).textContent = dueToday;

    document.getElementById(
        "due-week"
    ).textContent = dueWeek;

    document.getElementById(
        "completed-count"
    ).textContent = completed;

    document.getElementById(
        "overdue-count"
    ).textContent = overdue;

}


/* =========================================
   GAME PLANS
========================================= */

function renderGamePlans() {

    const container =
        document.getElementById(
            "game-plan-list"
        );

    container.innerHTML = "";


    const today =
        getLocalDateString();


    const todayPlans =
        gamePlans.filter(
            plan =>
                plan.date === today
        );


    if (todayPlans.length === 0) {

        container.innerHTML = `
            <div class="empty-state">
                Nothing planned yet. Add something to your day!
            </div>
        `;

        return;

    }


    todayPlans.forEach(plan => {

        const entry =
            document.createElement("div");

        entry.className = "entry";


        const entryInfo =
            document.createElement("div");

        entryInfo.className = "entry-info";


        const name =
            document.createElement("div");

        name.className = "entry-name";

        name.textContent =
            plan.name || "";


        const meta =
            document.createElement("div");

        meta.className = "entry-meta";

        meta.textContent =
            `${plan.subject || "Other"} · ${plan.assignmentType || "Other"} · ${plan.startTime || ""} – ${plan.endTime || ""}`;


        const statusButtons =
            document.createElement("div");

        statusButtons.className =
            "status-buttons";


        const completedButton =
            document.createElement("button");

        completedButton.type = "button";

        completedButton.className =
            "status-button status-completed";

        completedButton.textContent =
            "✓ Completed";


        const pendingButton =
            document.createElement("button");

        pendingButton.type = "button";

        pendingButton.className =
            "status-button status-pending";

        pendingButton.textContent =
            "○ Not Completed";


        function refreshStatus() {

            completedButton.classList.remove(
                "selected"
            );

            pendingButton.classList.remove(
                "selected"
            );


            if (
                plan.status ===
                "Completed"
            ) {

                completedButton.classList.add(
                    "selected"
                );

            } else {

                pendingButton.classList.add(
                    "selected"
                );

            }

        }


        refreshStatus();


        completedButton.addEventListener(
            "click",
            async () => {

                if (
                    plan.status ===
                    "Completed"
                ) {

                    return;

                }


                plan.status =
                    "Completed";

                refreshStatus();

                updateMetrics();


                completedButton.classList.add(
                    "saving"
                );

                pendingButton.classList.add(
                    "saving"
                );


                try {

                    await updateGamePlanStatus(
                        plan.id,
                        "Completed"
                    );

                } catch (error) {

                    console.error(error);

                    plan.status =
                        "Not Completed";

                    refreshStatus();

                    updateMetrics();

                } finally {

                    completedButton.classList.remove(
                        "saving"
                    );

                    pendingButton.classList.remove(
                        "saving"
                    );

                }

            }
        );


        pendingButton.addEventListener(
            "click",
            async () => {

                if (
                    plan.status ===
                        "Not Completed" ||
                    !plan.status
                ) {

                    return;

                }


                plan.status =
                    "Not Completed";

                refreshStatus();

                updateMetrics();


                completedButton.classList.add(
                    "saving"
                );

                pendingButton.classList.add(
                    "saving"
                );


                try {

                    await updateGamePlanStatus(
                        plan.id,
                        "Not Completed"
                    );

                } catch (error) {

                    console.error(error);

                    plan.status =
                        "Completed";

                    refreshStatus();

                    updateMetrics();

                } finally {

                    completedButton.classList.remove(
                        "saving"
                    );

                    pendingButton.classList.remove(
                        "saving"
                    );

                }

            }
        );


        statusButtons.appendChild(
            completedButton
        );

        statusButtons.appendChild(
            pendingButton
        );


        entryInfo.appendChild(name);

        entryInfo.appendChild(meta);

        entryInfo.appendChild(
            statusButtons
        );


        entry.appendChild(entryInfo);

        container.appendChild(entry);

    });

}


/* =========================================
   UPDATE GAME PLAN STATUS
========================================= */

async function updateGamePlanStatus(
    id,
    status
) {

    if (!currentUser) {

        throw new Error(
            "No logged-in user."
        );

    }


    const gamePlanRef =
        doc(
            db,
            "users",
            currentUser.uid,
            "gamePlans",
            id
        );


    await updateDoc(
        gamePlanRef,
        {
            status: status,
            updatedAt: serverTimestamp()
        }
    );


    const plan =
        gamePlans.find(
            item =>
                item.id === id
        );


    if (plan) {

        plan.status =
            status;

    }


    updateMetrics();

}


/* =========================================
   COMING UP
========================================= */

function renderComingUp() {

    const container =
        document.getElementById(
            "coming-up-list"
        );

    container.innerHTML = "";


    const today =
        dateOnly(new Date());


    const events =
        upcomingEvents
            .filter(event => {

                if (!event.date) {
                    return false;
                }

                return (
                    dateOnly(
                        new Date(event.date)
                    ) >= today
                );

            })
            .sort(
                (a, b) =>
                    new Date(a.date) -
                    new Date(b.date)
            )
            .slice(0, 5);


    if (events.length === 0) {

        container.innerHTML = `
            <div class="empty-state">
                Nothing coming up yet.
            </div>
        `;

        return;

    }


    events.forEach(event => {

        const date =
            dateOnly(
                new Date(event.date)
            );


        const difference =
            Math.round(
                (
                    date -
                    today
                ) / 86400000
            );


        const countdown =
            difference === 0
                ? "Today"
                : difference === 1
                    ? "1 day away"
                    : `${difference} days away`;


        const entry =
            document.createElement("div");

        entry.className = "entry";


        const entryInfo =
            document.createElement("div");

        entryInfo.className =
            "entry-info";


        const name =
            document.createElement("div");

        name.className = "entry-name";

        name.textContent =
            event.name || "";


        const meta =
            document.createElement("div");

        meta.className = "entry-meta";

        meta.textContent =
            `${event.subject || "Other"} · ${event.assignmentType || "Other"}`;


        const dateBox =
            document.createElement("div");

        dateBox.className = "entry-date";


        const strong =
            document.createElement("strong");

        strong.textContent =
            date.toLocaleDateString(
                "en-US",
                {
                    month: "short",
                    day: "numeric"
                }
            );


        const span =
            document.createElement("span");

        span.textContent =
            countdown;


        dateBox.appendChild(strong);
        dateBox.appendChild(span);


        entryInfo.appendChild(name);
        entryInfo.appendChild(meta);


        entry.appendChild(entryInfo);
        entry.appendChild(dateBox);


        container.appendChild(entry);

    });

}


/* =========================================================
   🔥 FIXED LOCK-IN SLIDER
========================================================= */


/* =========================================
   MAXIMUM HANDLE POSITION
========================================= */

function maxSliderPosition() {

    const sliderWidth =
        lockSlider.getBoundingClientRect().width;

    const handleWidth =
        lockHandle.getBoundingClientRect().width;

    return Math.max(
        0,
        sliderWidth -
        handleWidth -
        16
    );

}


/* =========================================
   UPDATE SLIDER VISUALLY
========================================= */

function setSliderProgress(percent) {

    if (lockedIn) {
        return;
    }


    sliderProgress =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        );


    const max =
        maxSliderPosition();


    const position =
        max *
        (
            sliderProgress /
            100
        );


    lockHandle.style.left =
        `${8 + position}px`;


    lockProgress.style.width =
        `${sliderProgress}%`;


    /* Rainbow colours */

    const rainbowColors = [

        "#FF4D6D",
        "#FF8A3D",
        "#FFD23F",
        "#7ED957",
        "#39D6C0",
        "#34D399",
        "#00C2FF",
        "#3B82F6",
        "#8B5CF6",
        "#A855F7",
        "#FF6FB5",
        "#D946EF",
        "#C026D3",
        "#A21CAF",
        "#86198F",
        "#6366F1",
        "#818CF8",
        "#22D3EE"

    ];


    const index =
        Math.floor(
            (
                sliderProgress /
                100
            ) *
            (
                rainbowColors.length - 1
            )
        );


    lockProgress.style.background =
        rainbowColors[
            Math.min(
                index,
                rainbowColors.length - 1
            )
        ];


    /* Automatically lock at 98% */

    if (
        sliderProgress >= 98
    ) {

        completeLockIn();

    }

}


/* =========================================
   UPDATE FROM POINTER
========================================= */

function updateSliderFromPointer(
    clientX
) {

    const rect =
        lockSlider.getBoundingClientRect();


    const handleWidth =
        lockHandle.getBoundingClientRect().width;


    const max =
        maxSliderPosition();


    let position =
        clientX -
        rect.left -
        handleWidth / 2 -
        8;


    position =
        Math.max(
            0,
            Math.min(
                max,
                position
            )
        );


    const percentage =
        max === 0
            ? 100
            : (
                position /
                max
            ) *
            100;


    setSliderProgress(
        percentage
    );

}


/* =========================================
   START DRAGGING
========================================= */

function startDragging(event) {

    if (lockedIn) {
        return;
    }


    event.preventDefault();


    dragging = true;


    lockSlider.classList.add(
        "dragging"
    );

    lockHandle.classList.add(
        "dragging"
    );


    try {

        lockSlider.setPointerCapture(
            event.pointerId
        );

    } catch (error) {

        console.log(
            "Pointer capture unavailable."
        );

    }


    updateSliderFromPointer(
        event.clientX
    );

}


/* =========================================
   DRAGGING
========================================= */

function dragSlider(event) {

    if (
        !dragging ||
        lockedIn
    ) {

        return;

    }


    event.preventDefault();


    updateSliderFromPointer(
        event.clientX
    );

}


/* =========================================
   STOP DRAGGING
========================================= */

function stopDragging(event) {

    if (!dragging) {
        return;
    }


    dragging = false;


    lockSlider.classList.remove(
        "dragging"
    );

    lockHandle.classList.remove(
        "dragging"
    );


    try {

        lockSlider.releasePointerCapture(
            event.pointerId
        );

    } catch (error) {

        /* Nothing needed here */

    }


    /*
     * If they didn't reach the end,
     * return the handle to the beginning.
     */

    if (
        !lockedIn &&
        sliderProgress < 98
    ) {

        sliderProgress = 0;

        lockHandle.style.left =
            "8px";

        lockProgress.style.width =
            "0%";

        lockProgress.style.background =
            "transparent";

    }

}


/* =========================================
   SLIDER EVENTS
========================================= */

lockSlider.addEventListener(
    "pointerdown",
    startDragging
);

lockSlider.addEventListener(
    "pointermove",
    dragSlider
);

lockSlider.addEventListener(
    "pointerup",
    stopDragging
);

lockSlider.addEventListener(
    "pointercancel",
    stopDragging
);


/* =========================================
   COMPLETE LOCK IN
========================================= */

async function completeLockIn() {

    if (lockedIn) {
        return;
    }


    lockedIn = true;

    dragging = false;

    sliderProgress = 100;


    const max =
        maxSliderPosition();


    lockHandle.style.left =
        `${8 + max}px`;


    lockProgress.style.width =
        "100%";


    lockProgress.style.background =
        "#22D3EE";


    lockText.textContent =
        "We're locked in!";


    lockSlider.style.background =
        "#22D3EE";


    lockSlider.classList.add(
        "completed"
    );


    lockHandle.classList.remove(
        "dragging"
    );


    lockSlider.classList.remove(
        "dragging"
    );


    /* SAVE TO FIREBASE */

    if (currentUser) {

        try {

            await setDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                ),
                {
                    lockedIn: true,
                    updatedAt:
                        serverTimestamp()
                },
                {
                    merge: true
                }
            );


            console.log(
                "Lock-in saved successfully."
            );


        } catch (error) {

            console.error(
                "Could not save lock-in:",
                error
            );

        }

    }


    /* SHOW DASHBOARD */

    showDashboard();


    /* CELEBRATION */

    showCelebration();

}


/* =========================================
   SHOW DASHBOARD
========================================= */

function showDashboard() {

    dashboardContent.classList.add(
        "visible"
    );


    if (!lockedIn) {
        return;
    }


    const max =
        maxSliderPosition();


    lockHandle.style.left =
        `${8 + max}px`;


    lockProgress.style.width =
        "100%";


    lockProgress.style.background =
        "#22D3EE";


    lockSlider.style.background =
        "#22D3EE";


    lockText.textContent =
        "We're locked in!";


    lockSlider.classList.add(
        "completed"
    );

}


/* =========================================
   RESTORE LOCKED SLIDER
========================================= */

function restoreLockedSlider() {

    if (!lockedIn) {

        sliderProgress = 0;

        lockHandle.style.left =
            "8px";

        lockProgress.style.width =
            "0%";

        lockProgress.style.background =
            "transparent";

        lockSlider.style.background =
            "#D1D5DB";

        lockText.textContent =
            "Are we ready to lock in?";

        lockSlider.classList.remove(
            "completed"
        );

        dashboardContent.classList.remove(
            "visible"
        );

        return;

    }


    requestAnimationFrame(() => {

        const max =
            maxSliderPosition();


        lockHandle.style.left =
            `${8 + max}px`;


        lockProgress.style.width =
            "100%";


        lockProgress.style.background =
            "#22D3EE";


        lockSlider.style.background =
            "#22D3EE";


        lockText.textContent =
            "We're locked in!";


        lockSlider.classList.add(
            "completed"
        );


        dashboardContent.classList.add(
            "visible"
        );

    });

}


/* =========================================
   CELEBRATION
========================================= */

function showCelebration() {

    const celebration =
        document.getElementById(
            "celebration"
        );


    celebration.classList.add(
        "show"
    );


    createConfetti();


    setTimeout(() => {

        celebration.classList.remove(
            "show"
        );

    }, 3000);

}


/* =========================================
   CONFETTI
========================================= */

function createConfetti() {

    const colors = [

        "#FF4D6D",
        "#FF8A3D",
        "#FFD23F",
        "#7ED957",
        "#39D6C0",
        "#00C2FF",
        "#8B5CF6",
        "#D946EF",
        "#22D3EE"

    ];


    for (
        let i = 0;
        i < 220;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            `${Math.random() * 100}%`;

        piece.style.top =
            `${Math.random() * 20}%`;


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        piece.style.setProperty(
            "--x",
            `${(
                Math.random() - 0.5
            ) *
            window.innerWidth *
            1.5}px`
        );


        piece.style.setProperty(
            "--y",
            `${Math.random() *
            window.innerHeight}px`
        );


        piece.style.setProperty(
            "--r",
            `${Math.random() *
            1440}deg`
        );


        document.body.appendChild(
            piece
        );


        setTimeout(
            () => piece.remove(),
            3200
        );

/* =========================================
   BACKGROUND
========================================= */

const backgroundInput =
    document.getElementById(
        "background-input"
    );


backgroundInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                const image =
                    event.target.result;


                localStorage.setItem(
                    `mypHavenBackground_${currentUser.uid}`,
                    image
                );


                applyBackground(
                    image
                );

            };


        reader.readAsDataURL(file);

    }
);


function loadBackground() {

    if (!currentUser) {
        return;
    }


    const image =
        localStorage.getItem(
            `mypHavenBackground_${currentUser.uid}`
        );


    if (image) {

        applyBackground(
            image
        );

    }

}


function applyBackground(image) {

    const background =
        document.getElementById(
            "dashboard-background"
        );

    const overlay =
        document.getElementById(
            "dashboard-overlay"
        );


    background.style.backgroundImage =
        `url("${image}")`;

    background.style.display =
        "block";

    overlay.style.display =
        "block";

}

/* =========================================
   ADD GAME PLAN
========================================= */

document.getElementById(
    "add-game"
).addEventListener(
    "click",
    async () => {

        const startTime =
            document.getElementById(
                "game-start"
            ).value;


        const endTime =
            document.getElementById(
                "game-end"
            ).value;


        const name =
            document.getElementById(
                "game-name"
            ).value.trim();


        const subject =
            document.getElementById(
                "game-subject"
            ).value;


        if (
            !startTime ||
            !endTime ||
            !name ||
            !subject ||
            !selectedGameType
        ) {

            alert(
                "Please complete all fields."
            );

            return;

        }


        const today =
            getLocalDateString();


        try {

            const ref =
                await addDoc(
                    collection(
                        db,
                        "users",
                        currentUser.uid,
                        "gamePlans"
                    ),
                    {
                        date: today,
                        startTime: startTime,
                        endTime: endTime,
                        name: name,
                        subject: subject,
                        assignmentType:
                            selectedGameType,
                        status:
                            "Not Completed",
                        createdAt:
                            serverTimestamp(),
                        updatedAt:
                            serverTimestamp()
                    }
                );


            gamePlans.push({

                id: ref.id,
                date: today,
                startTime: startTime,
                endTime: endTime,
                name: name,
                subject: subject,
                assignmentType:
                    selectedGameType,
                status:
                    "Not Completed"

            });


            gameModal.classList.remove(
                "show"
            );


            document.getElementById(
                "game-start"
            ).value = "";

            document.getElementById(
                "game-end"
            ).value = "";

            document.getElementById(
                "game-name"
            ).value = "";


            selectedGameType = "";


            document
                .querySelectorAll(
                    "#game-plan-modal .type-option"
                )
                .forEach(
                    b =>
                        b.classList.remove(
                            "selected"
                        )
                );


            renderEverything();


        } catch (error) {

            console.error(
                "Game Plan error:",
                error
            );


            alert(
                "The Game Plan could not be saved."
            );

        }

    }
);
