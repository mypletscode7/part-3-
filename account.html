```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MYP Haven | Account</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            background: #8B5CF6;
            color: #FFFFFF;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .account-container {
            width: min(520px, 100%);
        }

        .account-title {
            text-align: center;

            font-family: "Bricolage Grotesque", sans-serif;
            font-size: clamp(3.5rem, 10vw, 6rem);
            font-weight: 800;
            line-height: 0.9;

            letter-spacing: -0.055em;

            margin-bottom: 15px;
        }

        .account-subtitle {
            text-align: center;

            font-size: 1.05rem;
            line-height: 1.5;

            margin-bottom: 35px;
        }

        .account-card {
            background: #FFFFFF;
            color: #111111;

            border-radius: 28px;

            padding: 35px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.18);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 0.9rem;
            font-weight: 700;
        }

        input {
            width: 100%;

            height: 54px;

            padding: 0 16px;

            border: 2px solid #E5E7EB;
            border-radius: 14px;

            background: #FFFFFF;

            font-family: "DM Sans", sans-serif;
            font-size: 1rem;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #8B5CF6;

            box-shadow:
                0 0 0 4px rgba(139, 92, 246, 0.12);
        }

        .account-button {
            width: 100%;

            height: 56px;

            border: none;
            border-radius: 999px;

            background: #8B5CF6;
            color: #FFFFFF;

            font-family: "DM Sans", sans-serif;

            font-size: 1rem;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .account-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(139, 92, 246, 0.25);
        }

        .account-button:active {
            transform: scale(0.98);
        }

        .switch-text {
            margin-top: 22px;

            text-align: center;

            font-size: 0.9rem;
        }

        .switch-button {
            border: none;
            background: none;

            color: #8B5CF6;

            font-family: "DM Sans", sans-serif;
            font-weight: 700;

            cursor: pointer;
        }

        .error-message {
            display: none;

            margin-bottom: 18px;

            padding: 12px 15px;

            border-radius: 12px;

            background: #FEE2E2;
            color: #B91C1C;

            font-size: 0.9rem;
            font-weight: 600;
        }

        .success-message {
            display: none;

            margin-bottom: 18px;

            padding: 12px 15px;

            border-radius: 12px;

            background: #DCFCE7;
            color: #166534;

            font-size: 0.9rem;
            font-weight: 600;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .account-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>

    <main class="account-container">

        <h1 class="account-title">
            Welcome.
        </h1>

        <p class="account-subtitle">
            Create your MYP Haven account and start mastering the MYP.
        </p>


        <section class="account-card">

            <div
                class="error-message"
                id="error-message"
            ></div>

            <div
                class="success-message"
                id="success-message"
            ></div>


            <!-- SIGN UP -->

            <form id="signup-form">

                <div class="form-group">

                    <label for="signup-name">
                        Your Name
                    </label>

                    <input
                        id="signup-name"
                        type="text"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signup-email">
                        Email
                    </label>

                    <input
                        id="signup-email"
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signup-password">
                        Password
                    </label>

                    <input
                        id="signup-password"
                        type="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    class="account-button"
                    type="submit"
                >
                    Create Free Account
                </button>

            </form>


            <!-- LOGIN -->

            <form
                id="login-form"
                style="display: none;"
            >

                <div class="form-group">

                    <label for="login-email">
                        Email
                    </label>

                    <input
                        id="login-email"
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        id="login-password"
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    class="account-button"
                    type="submit"
                >
                    Sign In
                </button>

            </form>


            <p class="switch-text">

                <span id="switch-question">
                    Already have an account?
                </span>

                <button
                    class="switch-button"
                    id="switch-button"
                    type="button"
                >
                    Sign In
                </button>

            </p>

        </section>

    </main>


    <!-- =================================================
         FIREBASE
    ================================================= -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        /* =================================================
           FIREBASE CONFIGURATION
        ================================================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyBNI4CR26Re0xdh-T0XdVyb6fFN7SPgPNA",

            authDomain:
                "the-myp-haven.firebaseapp.com",

            projectId:
                "the-myp-haven",

            storageBucket:
                "the-myp-haven.firebasestorage.app",

            messagingSenderId:
                "904577455533",

            appId:
                "1:904577455533:web:1d918ee8a3caa547eefd24"

        };


        /* =================================================
           INITIALIZE FIREBASE
        ================================================= */

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        /* =================================================
           ELEMENTS
        ================================================= */

        const signupForm =
            document.getElementById(
                "signup-form"
            );

        const loginForm =
            document.getElementById(
                "login-form"
            );

        const switchButton =
            document.getElementById(
                "switch-button"
            );

        const switchQuestion =
            document.getElementById(
                "switch-question"
            );

        const errorMessage =
            document.getElementById(
                "error-message"
            );

        const successMessage =
            document.getElementById(
                "success-message"
            );


        /* =================================================
           MESSAGE FUNCTIONS
        ================================================= */

        function showError(message) {

            errorMessage.textContent =
                message;

            errorMessage.style.display =
                "block";

            successMessage.style.display =
                "none";

        }


        function showSuccess(message) {

            successMessage.textContent =
                message;

            successMessage.style.display =
                "block";

            errorMessage.style.display =
                "none";

        }


        /* =================================================
           SWITCH LOGIN / SIGNUP
        ================================================= */

        let loginMode = false;


        switchButton.addEventListener(
            "click",
            () => {

                loginMode =
                    !loginMode;

                errorMessage.style.display =
                    "none";

                successMessage.style.display =
                    "none";


                if (loginMode) {

                    signupForm.style.display =
                        "none";

                    loginForm.style.display =
                        "block";

                    switchQuestion.textContent =
                        "Don't have an account?";

                    switchButton.textContent =
                        "Create Account";

                } else {

                    signupForm.style.display =
                        "block";

                    loginForm.style.display =
                        "none";

                    switchQuestion.textContent =
                        "Already have an account?";

                    switchButton.textContent =
                        "Sign In";

                }

            }
        );


        /* =================================================
           CREATE ACCOUNT
        ================================================= */

        signupForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "signup-name"
                    ).value.trim();

                const email =
                    document.getElementById(
                        "signup-email"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "signup-password"
                    ).value;


                try {

                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    showSuccess(
                        `Welcome to MYP Haven, ${name}!`
                    );


                    setTimeout(() => {

                        window.location.href =
                            "./dashboard.html";

                    }, 1000);


                } catch (error) {

                    console.error(error);

                    showError(
                        "We couldn't create your account. Please check your details and try again."
                    );

                }

            }
        );


        /* =================================================
           SIGN IN
        ================================================= */

        loginForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "login-email"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "login-password"
                    ).value;


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    showSuccess(
                        "Welcome back!"
                    );


                    setTimeout(() => {

                        window.location.href =
                            "./dashboard.html";

                    }, 700);


} catch (error) {

    console.error("Firebase signup error:", error);

    showError(
        error.message
    );

}
            }
        );

    </script>

</body>

</html>
